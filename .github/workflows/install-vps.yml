name: install-vps

# Runs the full VPS install on a real Ubuntu runner, then connects through it.
on:
  push:
    branches: [master, main]
    paths:
      - 'vps/**'
      - '.github/workflows/install-vps.yml'
  pull_request:
    paths:
      - 'vps/**'
      - '.github/workflows/install-vps.yml'
  workflow_dispatch:

jobs:
  install:
    name: install (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The recommended proxy VPS: one REALITY inbound, nothing else.
          - name: minimal
            env: |
              REALITY_SNI=www.microsoft.com
              TAILSCALE=false
          # Everything on: two REALITY inbounds, Hysteria2 and derper.
          - name: full
            env: |
              REALITY_SNI=www.microsoft.com
              REALITY_SNI_B=www.bing.com
              HY2_ENABLED=true
              DERP_DOMAIN=derp.example.com
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vps
    steps:
      - uses: actions/checkout@v4

      # Later lines in .env win. No TS_AUTHKEY, so Tailscale login is skipped,
      # and derper just won't get a cert for derp.example.com.
      # CI runners reach the big-brand SNIs fine; on a real VPS, pick nearby sites.
      # The example leaves REALITY_SNI empty on purpose; lib.sh must refuse it.
      - name: Empty REALITY_SNI is rejected
        run: |
          cp .env.example .env
          if sudo ./install.sh < /dev/null 2> err.txt; then
            echo "expected failure"; exit 1
          fi
          cat err.txt
          grep -q 'REALITY_SNI is empty' err.txt

      - name: Configure
        run: printf '%s\n' "${{ matrix.env }}" >> .env

      - name: Install
        run: sudo ./install.sh < /dev/null

      # The glob runs under sudo: /opt/setup is mode 700.
      - name: Re-run keeps secrets
        run: |
          snapshot() { sudo sh -c 'sha256sum /opt/setup/secrets/* /opt/setup/sing-box/hy2.crt 2>/dev/null' || true; }
          before="$(snapshot)"
          sudo ./install.sh < /dev/null
          after="$(snapshot)"
          if [ "$before" != "$after" ]; then
            diff <(echo "$before") <(echo "$after")
            exit 1
          fi

      - name: Connect through every inbound
        run: sudo ./test/client-check.sh

      - name: Handshake-site check fails on a dead site
        run: |
          setup-dest-check www.microsoft.com
          if setup-dest-check does-not-exist.invalid; then
            echo "expected failure"; exit 1
          fi
          systemctl is-enabled setup-dest-check.timer
