name: install-vps

# Runs the full VPS install on a real Ubuntu runner, then connects through it.
on:
  push:
    branches: [master, main]
    paths:
      - 'vps/**'
      - '.github/workflows/install-vps.yml'
  pull_request:
    paths:
      - 'vps/**'
      - '.github/workflows/install-vps.yml'
  workflow_dispatch:

jobs:
  install:
    name: install (derper ${{ matrix.derper }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        derper: ["off", "on"]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vps
    steps:
      - uses: actions/checkout@v4

      # Example values are fine here: no TS_AUTHKEY, so Tailscale login is skipped,
      # and derper just won't get a cert for derp.example.com.
      - name: Configure
        run: |
          cp .env.example .env
          if [ "${{ matrix.derper }}" = on ]; then
            sed -i 's/^DERP_DOMAIN=.*/DERP_DOMAIN=derp.example.com/' .env
          fi

      - name: Install
        run: sudo ./install.sh < /dev/null

      # The glob runs under sudo: /opt/setup is mode 700.
      - name: Re-run keeps secrets
        run: |
          before="$(sudo sh -c 'sha256sum /opt/setup/secrets/* /opt/setup/sing-box/hy2.crt')"
          sudo ./install.sh < /dev/null
          after="$(sudo sh -c 'sha256sum /opt/setup/secrets/* /opt/setup/sing-box/hy2.crt')"
          if [ "$before" != "$after" ]; then
            diff <(echo "$before") <(echo "$after")
            exit 1
          fi

      - name: Connect through REALITY and Hysteria2
        run: sudo ./test/client-check.sh
